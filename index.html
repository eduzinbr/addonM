<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Hand Tracking - Apps Virtuais</title>
    <!-- Importando MediaPipe Hands e utilitários de câmera -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Vídeo oculto, pois renderizamos tudo no Canvas */
        video {
            display: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: scaleX(-1); /* Efeito espelho */
        }
        /* Painel de "Apps" Virtuais estilo VR / AR */
        .ui-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            pointer-events: none;
        }
        .app-icon {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 20px 30px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.2s ease;
        }
        .app-icon.active {
            background: rgba(0, 255, 128, 0.4);
            border-color: #00ff80;
            transform: scale(1.1);
            box-shadow: 0 0 20px #00ff80;
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <video class="input_video"></video>
    <canvas class="output_canvas"></canvas>

    <!-- Apps Virtuais na Tela -->
    <div class="ui-container">
        <div id="app1" class="app-icon">📁 Arquivos</div>
        <div id="app2" class="app-icon">🎵 Música</div>
        <div id="app3" class="app-icon">⚙️ Configs</div>
    </div>

    <div id="status">Aguardando permissão da câmera e detecção da mão...</div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        
        const app1 = document.getElementById('app1');
        const app2 = document.getElementById('app2');
        const app3 = document.getElementById('app3');
        const statusDiv = document.getElementById('status');

        function onResults(results) {
            // Ajustar tamanho do canvas à tela
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Desenhar feed da câmera no fundo
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDiv.innerText = "🖐️ Mão detectada! Aproxime o dedo indicador dos ícones para clicar.";

                for (const landmarks of results.multiHandLandmarks) {
                    // Desenhar o esqueleto (bones) da mão
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00ffcc', lineWidth: 4});
                    drawLandmarks(canvasCtx, landmarks, {color: '#ff0055', lineWidth: 2, radius: 5});

                    // Coordenadas da ponta do dedo indicador (Landmark 8)
                    const indexTip = landmarks[8];
                    
                    // Converter coordenadas normalizadas (0 a 1) para pixels da tela (com inversão de espelho)
                    const x = (1 - indexTip.x) * canvasElement.width;
                    const y = indexTip.y * canvasElement.height;

                    // Desenhar um cursor visual na ponta do dedo
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 12, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = '#ff0055';
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 3;
                    canvasCtx.strokeStyle = '#ffffff';
                    canvasCtx.stroke();

                    // Verificar colisão com os botões/apps
                    checkCollision(x, y, app1, "Arquivos");
                    checkCollision(x, y, app2, "Música");
                    checkCollision(x, y, app3, "Configurações");
                }
            } else {
                statusDiv.innerText = "👋 Coloque sua mão na frente da câmera para interagir.";
                app1.classList.remove('active');
                app2.classList.remove('active');
                app3.classList.remove('active');
            }
            canvasCtx.restore();
        }

        function checkCollision(x, y, element, appName) {
            const rect = element.getBoundingClientRect();
            // Como o canvas está espelhado com scaleX(-1), ajustamos o rect x proporcionalmente ou checamos a posição de tela
            // rect usa as coordenadas de tela normais. Vamos converter 'x' para coordenadas de tela reais sem o espelho do canvas:
            const screenX = window.innerWidth - x;

            if (screenX >= rect.left && screenX <= rect.right && y >= rect.top && y <= rect.bottom) {
                element.classList.add('active');
                statusDiv.innerText = `✨ Você clicou no app: ${appName}!`;
            } else {
                element.classList.remove('active');
            }
        }

        // Configuração do MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Inicialização da Câmera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        
        camera.start().catch(err => {
            statusDiv.innerText = "Erro ao acessar a câmera. Verifique as permissões.";
            console.error(err);
        });
    </script>
</body>
</html>
