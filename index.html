    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 3000px;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
            cursor: grab;
            user-select: none;
        }

        body:active {
            cursor: grabbing;
        }

        /* ============ OVERLAY DO TOPO (FIXO NA TELA) ============ */
        #hud {
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); 
            color: #fff; 
            padding: 8px 16px;
            font-family: monospace; 
            font-size: 14px; 
            border-radius: 6px;
            z-index: 999999; 
            border: 2px solid #555; 
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        #painelTeste {
            position: fixed; 
            top: 10px; 
            left: 10px; 
            z-index: 999999;
            background: rgba(0, 0, 0, 0.85); 
            padding: 8px; 
            border-radius: 8px;
            display: flex; 
            flex-wrap: wrap;
            gap: 6px; 
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            max-width: 250px;
        }
        #painelTeste button {
            background: #fe2c55; color: white; border: none; padding: 6px 10px;
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        #painelTeste button:hover { background: #ff4d6f; }

        #btnCamera {
            position: fixed; 
            top: 95px; 
            left: 10px; 
            z-index: 999999;
            background: rgba(0, 0, 0, 0.85); 
            color: #fff; 
            border: 1px solid #555;
            padding: 6px 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }
        #btnCamera:hover { background: rgba(254,44,85,0.9); }

        #btnReset {
            position: fixed; 
            top: 10px;

        #painelRank h4 { margin: 0 0 6px; font-size: 12px; color: #ffd700; text-align: center; }
        .rank-linha {
            display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.12);
        }
        .rank-linha:first-of-type { border-top: none; }
        .rank-avatar-wrap { position: relative; width: 24px; height: 24px; flex-shrink: 0; }
        .rank-avatar {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ffd700;
            object-fit: cover; display: block; box-shadow: 0 0 6px #ffd700;
        }
        .rank-coroa { position: absolute; top: -11px; left: -6px; font-size: 13px; }
        .rank-nome { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62px; }
        .rank-icone { width: 16px; height: 16px; }
        .rank-qtd { font-weight: bold; min-width: 18px; text-align: right; }
        .rank-vazio { font-size: 11px; color: #999; text-align: center; padding: 4px 0; }

        /* ============ PAINEL COMO JOGAR ============ */
        #painelInfo {
            position: fixed; 
            top: 255px; 
            right: 10px; 
            z-index: 999999;
            background: rgba(0, 0, 0, 0); 
            border: 2px solid rgba(255, 255, 255, 0.4); 
            border-radius: 8px;
            padding: 8px; 
            font-family: Arial, sans-serif; 
            color: white; 
            width: 175px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
        }
        #painelInfo h4 { margin: 0 0 6px; font-size: 12px; color: #00ffcc; text-align: center; text-shadow: 1px 1px #000; }

            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .info-icone { width: 30px; height: 30px; image-rendering: pixelated; }
        .info-seta { font-size: 14px; color: #ffeb3b; font-weight: bold; text-shadow: 1px 1px #000; }

            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999999;
            background: rgba(0, 0, 0, 0.92);
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 20px 35px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
            animation: popIn 0.4s ease-out;
            font-family: Arial, sans-serif;
            color: white;
            pointer-events: none;
        }
        #followBanner img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 12px #ffd700;

        #followBanner .titulo-follow {
            font-size: 14px;
            color: #ffeb3b;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #followBanner .nome-follow {
            font-size: 24px;
            font-weight: bold;
            margin-top: 4px;
            text-shadow: 2px 2px #000;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

    <script>
        // ============ FIREBASE ============
        const firebaseConfig = {
          apiKey: "AIzaSyDuKdQkPzGagnCIKUE5Yz_mKtpPw3OCf7c",
          authDomain: "starcord-14470.firebaseapp.com",
          databaseURL: "https://starcord-14470-default-rtdb.firebaseio.com",
          projectId: "starcord-14470",
          storageBucket: "starcord-14470.firebasestorage.app",
          messagingSenderId: "154662528498",
          appId: "1:154662528498:web:ff9815bb21dc2b4172776b",
          measurementId: "G-QR4Y9ZHMF0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('eventos/').remove();
        db.ref('ativas/').remove();

        const AVATAR_PADRAO = 'https://ui-avatars.com/api/?background=fe2c55&color=fff&size=150&name=';

        function getFirebaseKey(nome) {
            return nome.replace(/[.#$\/\[\]]/g, "_");
        }

        let globalRanking = {};
        db.ref('ranking/').on('value', (snapshot) => {
            globalRanking = snapshot.val() || {};
        });

        // ============ CONTROLE DE CÂMERA E ARRASTAR ============
        let cameraAuto = true;
        const btnCamera = document.getElementById('btnCamera');
        btnCamera.addEventListener('click', () => {
            cameraAuto = !cameraAuto;
            btnCamera.textContent = cameraAuto ? "🎥 Câmera: Auto" : "🎥 Câmera: Manual";
            btnCamera.style.background = cameraAuto ? "rgba(0,0,0,0.85)" : "rgba(254,44,85,0.9)";
        });

        let isDragging = false;
        let startY = 0;

        // ============ SONS ============
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function tocarSom(frequencia, duracao, tipoOnda = 'sine', volume = 0.15) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = tipoOnda;
                osc.frequency.value = frequencia;
                gain.gain.value = volume;
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracao);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + duracao);
            } catch (e) {}
        }
        function somLike() { tocarSom(900, 0.08, 'sine', 0.08); }
        function somGift() { tocarSom(700, 0.15, 'square'); setTimeout(() => tocarSom(1000, 0.2, 'square'), 120); }
        function somEvolucao() {
            tocarSom(600, 0.12, 'sawtooth');
            setTimeout(() => tocarSom(900, 0.12, 'sawtooth'), 100);
            setTimeout(() => tocarSom(1300, 0.22, 'sawtooth'), 200);
        }

        function somQuebrarPicareta() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const bufferSize = ctx.sampleRate * 0.18;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 4;
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(ctx.destination);
                noise.start(now);

                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                oscGain.gain.setValueAtTime(0.35, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(oscGain);
                oscGain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            } catch (e) {}

            try {
                const audio = new Audio('https://cdn.discordapp.com/attachments/1462160007893356677/1551579495339790466/minecraft-tool-break.mp3?ex=6ab27c82&is=6ab12b02&hm=f57b3f2d007a54f31410990bb0cf10e32fe92435bb59919dd8e5640ab2712128&');

                audio.play().catch(e => {});
            } catch(e) {}
        }

        // ============ REGRAS ============
        const ORDEM_TIERS = ['madeira', 'pedra', 'cobre', 'ferro', 'diamante', 'netherite'];
        function indiceTier(tier) { return ORDEM_TIERS.indexOf(tier); }

        const DURABILIDADE_MAX = {

        const CATEGORIA_BLOCO = {
            stone: 'pedra', andesite: 'pedra', deepslate: 'pedra', tuff: 'pedra',
            copper_ore: 'cobre', deepslate_copper_ore: 'cobre',
            iron_ore: 'ferro', deepslate_iron_ore: 'ferro',

        function salvarNoFirebase(jogador) {
            db.ref('ranking/' + getFirebaseKey(jogador.nome)).set({
                nome: jogador.nome,
                avatar: jogador.avatar,
                tier: jogador.tier,
                recursos: jogador.recursos,
                durabilidade: jogador.durabilidade,
                maxDurabilidade: jogador.maxDurabilidade
            });
        }

        function evoluir(jogador, novoTier) {
            jogador.tier = novoTier;
            jogador.progresso = 0;
            jogador.maxDurabilidade = DURABILIDADE_MAX[novoTier];
            jogador.durabilidade = jogador.maxDurabilidade;
            jogador.element.style.backgroundImage = `url('${IMG_PICARETA[novoTier]}')`;
            jogador.element.classList.add('evoluiu');
            setTimeout(() => jogador.element.classList.remove('evoluiu'), 1500);
            somEvolucao();
            salvarNoFirebase(jogador);
        }

        function creditarQuebra(jogador, tipoBloco) {
            jogador.durabilidade--;
            salvarNoFirebase(jogador);

            if (jogador.durabilidade <= 0) {
                somQuebrarPicareta();
                removerJogador(jogador);
                return;
            }

            const categoria = CATEGORIA_BLOCO[tipoBloco];
            if (!categoria) return;

            if (categoria === 'pedra') {
                if (jogador.tier === 'madeira') {
                    jogador.progresso++;
                    if (jogador.progresso >= META_EVOLUCAO.madeira) evoluir(jogador, 'pedra');
                    else salvarNoFirebase(jogador);
                }
                return;
            }

            if (indiceTier(jogador.tier) < TIER_MINIMO_RECURSO[categoria]) return;

            jogador.recursos[categoria] = (jogador.recursos[categoria] || 0) + 1;

            if (categoria === 'cobre' && jogador.tier === 'pedra') {
                jogador.progresso++;
                if (jogador.progresso >= META_EVOLUCAO.pedra) evoluir(jogador, 'cobre');
                else salvarNoFirebase(jogador);
            } else if (categoria === 'ferro' && jogador.tier === 'cobre') {
                jogador.progresso++;
                if (jogador.progresso >= META_EVOLUCAO.cobre) evoluir(jogador, 'ferro');
                else salvarNoFirebase(jogador);
            } else if (categoria === 'diamante' && jogador.tier === 'ferro') {
                jogador.progresso++;
                if (jogador.progresso >= META_EVOLUCAO.ferro) evoluir(jogador, 'diamante');
                else salvarNoFirebase(jogador);
            } else {
                salvarNoFirebase(jogador);
            }
        }

        function rollBlockType(r) {
            if (r === 0) return 'grass';
            if (r <= 6) return 'dirt';
            const roll = Math.random();
            if (r <= 30) {
                if (r >= 25 && roll < 0.01) return 'diamond_ore';
                if (r >= 25 && roll < 0.02) return 'emerald_ore';
                if (roll < 0.05) return 'iron_ore';
                if (roll < 0.08) return 'copper_ore';
                if (roll < 0.14) return 'andesite';
                return 'stone';
            }
            if (r % 5 === 0) return 'tuff';
            if (roll < 0.02) return 'deepslate_diamond_ore';
            if (roll < 0.035) return 'deepslate_emerald_ore';
            if (roll < 0.075) return 'deepslate_iron_ore';
            if (roll < 0.105) return 'deepslate_copper_ore';

        function criarJogador(nome, avatar, tierPadrao) {
            if (picaretasPorNome.has(nome)) return picaretasPorNome.get(nome);

            if (picaretas.length >= MAX_PICARETAS) {
                const idx = picaretas.findIndex(j => j.tier !== 'netherite');

                    recursosIniciais = { ...globalRanking[firebaseKey].recursos };

            salvarNoFirebase(jogador);

            db.ref('ativas/' + firebaseKey).set(true);

            const avatar = dados.avatar || (AVATAR_PADRAO + encodeURIComponent(dados.nome));

            if (dados.tipo === 'like') {
                const qtdLikes = dados.likeCount || 1;
                const existente = picaretasPorNome.get(dados.nome);
                if (existente) {
                    existente.durabilidade = Math.min(existente.maxDurabilidade, existente.durabilidade + qtdLikes);
                    salvarNoFirebase(existente);
                    somLike();
                } else {
                    criarJogador(dados.nome, avatar, 'madeira');
                    somLike();
                }
            } else if (dados.tipo === 'follow') {
                mostrarBannerFollow(dados.nome, avatar);
                const existente = picaretasPorNome.get(dados.nome);
                if (!existente) {
                    criarJogador(dados.nome, avatar, 'pedra');
                } else if (indiceTier(existente.tier) < indiceTier('pedra')) {
                    evoluir(existente, 'pedra');

        // ============ RANKING ============
        function melhorEmGlobal(categoria) {
            let melhor = null;
            let maiorQtd = 0;
            for (let key in globalRanking) {
                const p = globalRanking[key];
                const qtd = (p.recursos && p.recursos[categoria]) || 0;

                    <div class="rank-avatar-wrap">
                        <img class="rank-avatar" src="${avatar}">
                        ${ehPrimeiro ? '<span class="rank-coroa">👑</span>' : ''}
                    </div>
                    <span class="rank-nome">${melhor.nome}</span>
                    <img class="rank-icone" src="${iconeUrl}">
                    <span class="rank-qtd">${qtd}</span>
                </div>`;
        }

        function atualizarRank() {
            document.getElementById('rankConteudo').innerHTML =
                linhaRank('esmeralda', IMG_RECURSO.esmeralda, true) +
                linhaRank('diamante', IMG_RECURSO.diamante, false) +
                linhaRank('ferro', IMG_RECURSO.ferro, false) +
                linhaRank('cobre', IMG_RECURSO.cobre, false);
        }
        setInterval(atualizarRank, 500);

        // ============ FÍSICA ============
        function updatePickaxe(jogador) {
            jogador.vy += gravity;
            jogador.x += jogador.vx;
            jogador.y += jogador.vy;

            if (jogador.x < leftBound) { jogador.x = leftBound; jogador.vx = -jogador.vx * 0.85; jogador.omega += 4; }
            else if (jogador.x > rightBound) { jogador.x = rightBound; jogador.vx = -jogador.vx * 0.85; jogador.omega -= 4; }

            if (jogador.rotatingRight) { jogador.omega += 0.6; if (jogador.omega > 10) jogador.omega = 10; }
            else { jogador.omega *= 0.95; }
            jogador.angle += jogador.omega;
            jogador.vx *= 0.98;

            let cx = jogador.x + 24, cy = jogador.y + 24;
            let rad = jogador.angle * Math.PI / 180;
            let cos = Math.cos(rad), sin = Math.sin(rad);
            let p8X = cx + (16 * cos - (-16) * sin);
            let p8Y = cy + (16 * sin + (-16) * cos);

            let collided = false;
            for (let colData of columnData) {
                let colLeft = colData.element.offsetLeft;
                let colRight = colLeft + colData.element.offsetWidth;
                if (jogador.x + 48 < colLeft - 50 || jogador.x > colRight + 50) continue;

                for (let b of colData.blocks) {
                    if (b.style.visibility === 'hidden') continue;
                    let rect = b.getBoundingClientRect();
                    let blockLeft = rect.left + window.scrollX, blockRight = rect.right + window.scrollX;
                    let blockTop = rect.top + window.scrollY, blockBottom = rect.bottom + window.scrollY;
                    let pLeft = jogador.x, pRight = jogador.x + 48, pTop = jogador.y, pBottom = jogador.y + 48;

                    if (pRight > blockLeft && pLeft < blockRight && pBottom > blockTop && pTop < blockBottom) {
                        collided = true;
                        
                        b.currentHits++;
                        if (b.regenTimeout) clearTimeout(b.regenTimeout);
                        
                        b.regenTimeout = setTimeout(() => {
                            if (b.currentHits > 0 && b.style.visibility !== 'hidden') {
                                b.currentHits = 0;
                                b.querySelector('.block-overlay').className = 'block-overlay';
                            }
                        }, 5000);

                        const damageStage = Math.min(MAX_STAGE, Math.ceil((b.currentHits / b.maxHits) * MAX_STAGE));
                        b.querySelector('.block-overlay').className = `block-overlay stage-${damageStage}`;

                        if (b.currentHits >= b.maxHits) {
                            if (b.regenTimeout) clearTimeout(b.regenTimeout);
                            b.style.visibility = 'hidden';
                            creditarQuebra(jogador, b.getAttribute('data-type'));
                            if (!picaretas.includes(jogador)) break;
                        }

                        let overlapX = Math.min(pRight - blockLeft, blockRight - pLeft);
                        let overlapY = Math.min(pBottom - blockTop, blockBottom - pTop);

                        if (overlapY < overlapX) {
                            if (pTop + 24 < blockTop + (blockBottom - blockTop) / 2) {
                                jogador.y = blockTop - 48;
                                let hitPixel8 = (p8X >= blockLeft - 5 && p8X <= blockRight + 5 && p8Y >= blockTop - 5 && p8Y <= blockBottom + 5);
                                if (hitPixel8 || cx > blockLeft + (blockRight - blockLeft) / 2) {
                                    jogador.rotatingRight = false; jogador.omega = -6.0; jogador.vy = -2.2; jogador.vx -= 2.5;
                                } else {
                                    jogador.rotatingRight = true; jogador.vy = -2.2; jogador.vx += 2.5;
                                }
                            } else {
                                jogador.y = blockBottom; jogador.vy = Math.abs(jogador.vy) * 0.3;
                            }
                        } else {
                            if (pLeft + 24 < blockLeft + (blockRight - blockLeft) / 2) {
                                jogador.x = blockLeft - 48; jogador.vx = -Math.abs(jogador.vx) * 0.7 - 3.0; jogador.omega -= 5; jogador.vy = -1.5;
                            } else {
                                jogador.x = blockRight; jogador.vx = Math.abs(jogador.vx) * 0.7 + 3.0; jogador.omega += 5; jogador.vy = -1.5;
                            }
                        }
                        break;
                    }
                }
                if (collided || !picaretas.includes(jogador)) break;
            }

            if (picaretas.includes(jogador)) {
                jogador.element.style.left = jogador.x + 'px';
                jogador.element.style.top = jogador.y + 'px';
                jogador.element.style.transform = `rotate(${jogador.angle}deg)`;
                
                let pct = Math.max(0, Math.min(1, jogador.durabilidade / jogador.maxDurabilidade));
                let red = Math.floor(255 * (1 - pct));
                let green = Math.floor(255 * pct);
                let corDura = `rgb(${red}, ${green}, 0)`;

                jogador.label.innerHTML = `${jogador.nome} <span class="durability-square" style="background-color: ${corDura};" title="${jogador.durabilidade}/${jogador.maxDurabilidade}"></span>`;
                jogador.label.style.left = (jogador.x + 24 - jogador.label.offsetWidth / 2) + 'px';
                jogador.label.style.top = (jogador.y - 16) + 'px';
            }
        }

        function checkPicaretasColisao() {
            for (let i = 0; i < picaretas.length; i++) {
                for (let j = i + 1; j < picaretas.length; j++) {
                    const a = picaretas[i], b = picaretas[j];
                    let cx1 = a.x + 24, cy1 = a.y + 24, cx2 = b.x + 24, cy2 = b.y + 24;
                    let dx = cx2 - cx1, dy = cy2 - cy1;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let minDistance = 44;
                    if (distance < minDistance && distance > 0) {
                        let nx = dx / distance, ny = dy / distance;
                        let overlap = (minDistance - distance) / 2;
                        a.x -= nx * overlap; a.y -= ny * overlap;
                        b.x += nx * overlap; b.y += ny * overlap;
                        let impulseX = 5.5, impulseY = 1.5;
                        a.vx -= nx * impulseX; a.vy -= ny * impulseY;
                        b.vx += nx * impulseX; b.vy += ny * impulseY;
                        a.omega += (Math.random() - 0.5) * 8;
                        b.omega += (Math.random() - 0.5) * 8;
                    }
                }
            }
        }

        function gameLoop() {
            picaretas.forEach(updatePickaxe);
            checkPicaretasColisao();
            hud.textContent = `⛏️ Picaretas ativas: ${picaretas.length}`;

            if (cameraAuto && picaretas.length > 0 && !isDragging) {
                let maxY = Math.max(...picaretas.map(j => j.y));
                let targetScrollY = maxY - window.innerHeight / 2 + 100;
                if (targetScrollY > window.scrollY) {
                    window.scrollBy(0, (targetScrollY - window.scrollY) * 0.1);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('load', () => requestAnimationFrame(gameLoop));
    </script>
</body>
</html>
