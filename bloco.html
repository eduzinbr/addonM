<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Bloco - StarCat Add-on Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🧱 Criar Novo Bloco</h2>
        <div class="card">
            <div id="status" class="status">Bloco salvo com sucesso!</div>
            <form id="bloco-form">
                <label>Namespace (ex: meu_addon)</label>
                <input type="text" id="namespace" value="starcat" required>

                <label>Nome do Bloco (sem espaços, ex: tijolo_rubi)</label>
                <input type="text" id="name" placeholder="ex: bloco_magico" required>

                <label>Dureza / Resistência (hardness)</label>
                <input type="number" step="0.1" id="hardness" value="1.5">

                <button type="submit">Salvar Bloco</button>
            </form>
        </div>
        <a href="index.html" class="back-link">← Voltar ao Início</a>
    </div>
    <script src="builder.js"></script>
    <script>
        document.getElementById('bloco-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                namespace: document.getElementById('namespace').value,
                name: document.getElementById('name').value,
                hardness: document.getElementById('hardness').value
            };
            saveToStorage('bloco', data);
            let st = document.getElementById('status');
            st.style.display = 'block';
            setTimeout(() => st.style.display = 'none', 3000);
            document.getElementById('name').value = '';
            updateCounts();
        });
    </script>
</body>
</html>
