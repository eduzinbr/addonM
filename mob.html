<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Mob - StarCat Add-on Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🧟 Criar Novo Mob</h2>
        <div class="card">
            <div id="status" class="status">Mob salvo com sucesso!</div>
            <form id="mob-form">
                <label>Namespace (ex: starcat)</label>
                <input type="text" id="namespace" value="starcat" required>

                <label>Nome do Mob (sem espaços, ex: boss_zumbi)</label>
                <input type="text" id="name" placeholder="ex: guardiao" required>

                <label>Vida Máxima (Health)</label>
                <input type="number" id="health" value="20">

                <label>Velocidade (Movement Speed)</label>
                <input type="number" step="0.05" id="speed" value="0.3">

                <button type="submit">Salvar Mob</button>
            </form>
        </div>
        <a href="index.html" class="back-link">← Voltar ao Início</a>
    </div>
    <script src="builder.js"></script>
    <script>
        document.getElementById('mob-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                namespace: document.getElementById('namespace').value,
                name: document.getElementById('name').value,
                health: document.getElementById('health').value,
                speed: document.getElementById('speed').value
            };
            saveToStorage('mob', data);
            let st = document.getElementById('status');
            st.style.display = 'block';
            setTimeout(() => st.style.display = 'none', 3000);
            document.getElementById('name').value = '';
            updateCounts();
        });
    </script>
</body>
</html>
